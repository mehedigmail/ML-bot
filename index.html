<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Trading Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<button id="launcher" class="launcher">AI</button>

<main id="panel" class="panel hidden">
  <header id="dragHeader" class="header">
    <div>
      <b>AI TRADING BOT</b>
      <small id="connection">Connecting...</small>
    </div>
    <button id="closeBtn">−</button>
  </header>

  <section class="content">
    <div class="line">
      <span>Selected Market</span>
      <b id="selectedPair">Scanning...</b>
    </div>

    <div class="line">
      <span>Market Price</span>
      <b id="price">--</b>
    </div>

    <div class="line">
      <span>Signal</span>
      <strong id="signal" class="wait">WAIT</strong>
    </div>

    <div class="line">
      <span>Confidence</span>
      <b id="confidence">--%</b>
    </div>

    <div class="line">
      <span>Next Signal Check</span>
      <b id="countdown">--</b>
    </div>

    <p id="signalReason">Press Start Analysis.</p>

    <div class="buttons">
      <button id="startBtn" class="start">START ANALYSIS</button>
      <button id="stopBtn" class="stop" disabled>STOP</button>
    </div>

    <a class="broker" href="https://quotex.com/en/"
       target="_blank" rel="noopener noreferrer">
       OPEN QUOTEX ↗
    </a>

    <small id="lastUpdated">Not started</small>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
